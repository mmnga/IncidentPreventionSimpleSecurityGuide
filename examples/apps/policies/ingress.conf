# SYNTHETIC ingress include; real TLS material and upstream deployment are not supplied.
server {
    listen 443 ssl;
    server_name api.atlas.invalid;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location / {
        proxy_pass http://atlas_api;
        proxy_set_header Host api.atlas.invalid;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
# Backend must accept forwarded transport metadata only from this ingress network.
# This include is not a complete nginx configuration; it is never started by the example.
